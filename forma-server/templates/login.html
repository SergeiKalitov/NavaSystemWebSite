<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forma — Sign in</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{background:#fff;width:100%;max-width:380px;border:1px solid #e4e4df;border-radius:24px;padding:32px}.logo{display:flex;align-items:center;gap:9px;font-size:27px;font-weight:750;letter-spacing:-1px}.mark{background:#303030;color:#dfbd7d;border:1px solid #695431;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:23px}h1{font-size:23px;margin:30px 0 20px}label{display:block;margin:12px 0;font-size:12px;color:#707070}input{display:block;width:100%;margin-top:7px;font:inherit;font-size:16px;padding:15px;border:1px solid #ddddd5;border-radius:10px;background:#fbfbf8}input:focus-visible{outline:2px solid #bb944d}button{width:100%;min-height:50px;margin-top:13px;border:1px solid #9f7b3b;border-radius:11px;background:linear-gradient(145deg,#33312d,#222120);color:#e2c48c;font:inherit;font-weight:600;cursor:pointer}.error{font-size:13px;color:#9b4036;line-height:1.5}</style></head><body><main class="card"><div class="logo"><span class="mark">↗</span>forma<span style="color:#b68c3d">.</span></div><h1>Sign in</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Login<input name="login" autocomplete="username" autocapitalize="none" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<button>Sign in</button></form></main></body></html>
